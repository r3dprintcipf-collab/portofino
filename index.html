<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofino - Choisissez votre restaurant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/brittany-signature" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f7f3e9;
            --card-bg: #fffbf2;
            --text-color: #1a1a1a;
            --brand-red: #a82329;
            --brand-green: #1b4d3e;
            --line-color: #e2dacb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image: 
                radial-gradient(rgba(139, 69, 19, 0.04) 1px, transparent 0),
                radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 0);
            background-size: 12px 12px, 20px 20px;
        }

        /* DAMIER PERIMETRIQUE */
        .damier {
            position: fixed;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><rect width="14" height="14" fill="%23a82329"/><rect x="14" width="14" height="14" fill="%23ffffff"/><rect y="14" width="14" height="14" fill="%23ffffff"/><rect x="14" y="14" width="14" height="14" fill="%23a82329"/></svg>');
            background-size: 28px 28px;
            z-index: 1000;
            pointer-events: none;
        }
        .damier-top { top: 0; left: 0; right: 0; height: 28px; background-repeat: repeat-x; }
        .damier-bottom { bottom: 0; left: 0; right: 0; height: 28px; background-repeat: repeat-x; background-position: left bottom; }
        .damier-left { top: 28px; bottom: 28px; left: 0; width: 28px; background-repeat: repeat-y; }
        .damier-right { top: 28px; bottom: 28px; right: 0; width: 28px; background-repeat: repeat-y; background-position: right top; }

        /* CARTE CENTRALE */
        .landing-card {
            background-color: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            padding: 40px 25px;
            border: 1px solid rgba(226, 218, 203, 0.9);
            width: 100%;
            max-width: 480px;
            text-align: center;
            z-index: 10;
        }

        .header-brand img {
            max-width: 160px;
            height: auto;
            margin: 0 auto;
            display: block;
            -webkit-mask-image: radial-gradient(circle, black 68%, transparent 72%);
            mask-image: radial-gradient(circle, black 68%, transparent 72%);
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.08));
        }

        .brand-subtitle {
            font-family: 'Brittany Signature', cursive;
            font-size: 1.6rem;
            color: var(--brand-red);
            margin-top: 5px;
        }

        .welcome-title {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            color: var(--brand-green);
            margin-top: 15px;
            margin-bottom: 25px;
            line-height: 1.1;
        }

        /* BOUTONS DE SÉLECTION DU RESTAURANT */
        .location-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .location-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-color: #fff;
            border: 2px solid var(--line-color);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .location-btn:hover {
            border-color: var(--brand-green);
            background-color: rgba(27, 77, 62, 0.03);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .location-btn:active {
            transform: scale(0.98);
        }

        .location-name {
            font-family: 'Kalam', cursive, sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--brand-red);
        }

        .location-action {
            font-size: 0.82rem;
            color: #666;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- CADRE DAMIER -->
    <div class="damier damier-top"></div>
    <div class="damier damier-bottom"></div>
    <div class="damier damier-left"></div>
    <div class="damier damier-right"></div>

    <div class="landing-card">
        <div class="header-brand">
            <img src="logo.jpg" alt="Logo Portofino">
            <div class="brand-subtitle">By H. Salloub</div>
        </div>

        <h1 class="welcome-title">Choisissez votre restaurant</h1>

        <div class="location-list">
            <!-- RESTAURANT 1 -->
            <a href="marcory.html" class="location-btn">
                <span class="location-name">📍 Marcory</span>
                <span class="location-action">Voir le menu</span>
            </a>

            <!-- RESTAURANT 2 -->
            <a href="padel-house.html" class="location-btn">
                <span class="location-name">📍 Padel House</span>
                <span class="location-action">Voir le menu</span>
            </a>

            <!-- RESTAURANT 3 -->
            <a href="riviera.html" class="location-btn">
                <span class="location-name">📍 Riviera</span>
                <span class="location-action">Voir le menu</span>
            </a>
        </div>
    </div>

</body>
</html>
